         attributes onto the page, so it must sit BEFORE index-motion.js, whose
         single IntersectionObserver collects them on DOMContentLoaded. Swap the
         two and the inner pages animate nothing.
         page-fx.js is inner-page only; it returns immediately if it finds
         index.html's .mrn-hero. -->
